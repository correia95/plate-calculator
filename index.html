    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I work out what plates to put on a barbell?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Subtract the bar weight from your target, halve it, and load that per side starting with the heaviest plate. For 100 kg on a 20 kg bar that is 40 kg per side: a 25 and a 15."
            }
          },
          {
            "@type": "Question",
            "name": "How much does a barbell weigh?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A standard men's Olympic barbell is 20 kg (about 45 lb) and a women's Olympic barbell is 15 kg (about 35 lb). Training and technique bars are lighter. Pick the right one in the calculator."
            }
          },
          {
            "@type": "Question",
            "name": "What are the colours of weight plates?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The IWF colour scheme is red for 25 kg, blue for 20, yellow for 15, green for 10 and white for 5. Smaller change plates repeat the colours."
            }
          },
          {
            "@type": "Question",
            "name": "What if I can't make the exact weight?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Turn on the limited-plate mode and enter how many of each plate you have. If you land under the target the calculator shows by how much. Fractional plates of 0.5 or 1.25 kg are how people make small increases."
            }
          }
        ]
      }
    </script>
